version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: stockapp
      POSTGRES_DB: stockapp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockapp -d stockapp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
